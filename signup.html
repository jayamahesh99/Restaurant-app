{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.css' %}" />

  <!--owl slider stylesheet -->
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <!-- nice select  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css" integrity="sha512-CruCP+TD3yXzlvvijET8wV5WxxEh5H8P4cmz0RFbKK6FlZ2sYl3AEsKlLPHbniXKSrDdFewhbmBK5skbdsASbQ==" crossorigin="anonymous" />
  <!-- font awesome style -->
  <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet" />

  <!-- Custom styles for this template -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet" />
  <!-- responsive style -->
  <link href="{% static 'css/responsive.css' %}" rel="stylesheet" />
</head>
<body>
  <div style="margin-left: auto;margin-right:auto;width:500px;">
    <h1 style="font-family: sans-serif;">This is signup page</h1>
    <form action="signup" method="post">
      {% csrf_token %}
    <input type="text" placeholder="firstname" class="form-control mt-10" name="firstname" />
    <input type="text" placeholder="lastname" class="form-control mt-3" name="lastname" />
    <input type="text" placeholder="email" class="form-control mt-3" name="email" />
    <input type="text" placeholder="username" class="form-control mt-3" name="uname" />
    <input type="text" placeholder="password" class="form-control mt-3" name="pwd" />

    <input type="submit" value="submit" class="btn btn-primary mt-3"/>
    {% for message in messages %}
    <h1 style="color: red;">{{message}}</h1>
    {%endfor%}
    </form>
  </div> 
</body>
</html>
